spring.application.name=regression-lab
server.port=${PORT:8080}

# Version / environment are injected at launch (see scripts/run-version.ps1)
app.version=${APP_VERSION:dev}
app.env=${APP_ENV:lab}

# Human-readable console, Datadog-friendly JSON in the log file
logging.file.name=${LOG_FILE:logs/regression-lab.json}
logging.structured.format.file=logstash
logging.structured.json.add.service=regression-lab
logging.structured.json.add.env=${app.env}
logging.structured.json.add.version=${app.version}
logging.structured.json.add.ddsource=java

management.endpoints.web.exposure.include=health,info
